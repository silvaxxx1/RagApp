global:
  scrape_interval: 15s
  evaaluation_interval: 15s 

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['fastapi:8000']
    metrics_path: '/random_ass_name_4_security'

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'  

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187'] 
